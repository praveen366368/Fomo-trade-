# FOMO Family engine settings. Any key can be overridden with an environment
# variable FOMO_<KEY>, e.g. FOMO_STAKE_USD=2. Secrets (AI key) go ONLY in env.

# ---- mode & money -----------------------------------------------------------
mode = paper                 # paper only in this build; live = phase 2
stake_usd = 1                # $ per coin (owner's rule). Research: $2-5 beats fees.
paper_balance_usd = 250      # research: ~$220+ bankroll needed for $1 stakes (Kelly)
close_at_end = true          # paper run sells everything at the end

# ---- loop -------------------------------------------------------------------
cycle_seconds = 10           # discovery + filter loop
monitor_seconds = 4          # open-position price checks
watch_minutes = 30           # how long a coin can wait to qualify
deep_checks_per_cycle = 4    # RugCheck/Jupiter checks per cycle (rate limits)
market_calls_per_cycle = 6   # Dexscreener batch calls (30 coins each)
max_watch_pool = 400

# ---- discovery --------------------------------------------------------------
launch_gecko_every_s = 30
launch_profiles_every_s = 30
trend_every_s = 60
smart_every_s = 30
wallets_file = config/wallets.csv
solana_rpc_url = https://api.mainnet-beta.solana.com
trader_mute_after_signals = 8
trader_mute_below_hit_rate = 0.15

# ---- 8 LiquidityGuard -------------------------------------------------------
liq_min_usd = 8000
liq_dead_usd = 1000
liq_max_fdv_ratio = 40
mcap_min_usd = 10000
mcap_max_usd = 5000000
age_min_minutes = 3          # skip the first minutes (bundles/snipers)
age_max_minutes = 1440
bonding_curve_ok = false     # true = also buy pre-graduation pump.fun coins

# ---- 9 SocialCheck ----------------------------------------------------------
social_required = true       # Telegram/X presence graduated 8.9x more often (study)
social_copycat_limit = 3

# ---- 10 Momentum ------------------------------------------------------------
mom_min_buys_m5 = 25
mom_min_buy_sell_ratio = 1.1
mom_min_chg_m5_pct = -15
mom_max_chg_m5_pct = 120     # don't chase a vertical candle
mom_min_turnover_m5 = 0.05

# ---- 7 Volatility -----------------------------------------------------------
vol_max_per_min = 0.35

# ---- 11 RugGuard ------------------------------------------------------------
rug_max_score_normalised = 50
rug_min_lp_locked_pct = 90
rug_max_danger_risks = 0

# ---- 12 HolderAnalyst -------------------------------------------------------
hold_max_top10_pct = 30
hold_max_single_pct = 10
hold_max_creator_pct = 5
hold_max_insiders = 2
hold_max_creator_tokens = 3
hold_min_holders = 50

# ---- 13 HoneypotTester ------------------------------------------------------
slippage_bps = 1500          # quote tolerance only; live mode will use tighter + min-out
honeypot_max_roundtrip_loss_pct = 12
honeypot_max_price_impact_pct = 5

# ---- 14 OrganicFlow ---------------------------------------------------------
organic_min_score = 5
organic_min_buy_share = 0.03
organic_min_traders_5m = 20
organic_max_dev_mints = 20

# ---- 15 NarrativeAI (Jev or any OpenAI-compatible endpoint) -----------------
# ai_url = https://<provider>/v1/chat/completions   (key: env FOMO_AI_KEY)
ai_model = jev-latest

# ---- 16 Strategist / 17 RiskGovernor ----------------------------------------
entry_score = 65
smart_money_bonus = 15
boost_bonus = 3
risk_daemon = risk/_build/default/bin/riskd.exe
risk_max_open = 25
risk_max_deployed_usd = 25
risk_daily_loss_usd = 12     # research: 8-15 stakes/day limit helps
risk_max_trades_hour = 30
risk_reserve_usd = 2

# ---- 19 ExitManager ---------------------------------------------------------
# trail  = research-best: arm trailing stop at 1.5x, sell if -30% from peak,
#          leave after 5 min if it never moved +15%.
# fixed  = sell everything at +take_profit_pct.
# ladder = sell slices at tp_ladder (multiple:fraction of initial), trail rest.
exit_mode = trail
take_profit_pct = 100
tp_ladder = 2:0.5,5:0.25,10:0.15
trail_arm_multiple = 1.5
trail_from_peak_pct = 30
time_stop_minutes = 5
time_stop_min_multiple = 1.15
stop_loss_multiple = 0.5
max_hold_minutes = 360
rug_liquidity_drop_pct = 50

# ---- costs (direct on-chain via Jupiter; pool fees are inside the quote) ----
fee_base_lamports = 5000
fee_priority_lamports = 50000
fee_tip_lamports = 0
fee_platform_pct = 0         # set 0.5 to model trading through the fomo app
fee_ata_rent_sol = 0.00203928
fee_extra_slippage_pct = 3

# ---- 20 Auditor -------------------------------------------------------------
audit_every_s = 300
audit_max_tracked = 400
health_max_error_rate = 0.5
